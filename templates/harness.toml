[project]
# Repository-shared Rig lifecycle. Existing harnesses without this section remain enabled.
enabled = true

[routing]
# Smart is also the default when this section is omitted. Legacy restores the old ladder.
mode = "smart"
# Local scored routing is the default. Set engine = "jev" after adding a global key.
engine = "local"
local_policy = "scored-v1"
objective = "balanced"
# Opt-in preparation-aware effort pilot (docs/preparation-pilot.md). Absent means false.
# preparation_aware_effort = false

[orchestration]
# Adaptive decomposes eligible work into a DAG (max 12 nodes). single keeps one-job behavior.
mode = "adaptive"
max_nodes = 12

[workers]
codex = false
grok = true
claude = true
cursor = false
opencode = false
omp = false
pi = false
agy = false
devin = false
mimo = false

[queue]
max_running = 3
# max_per_worker = 2
# [queue.workers]
# grok = 2

# Parent-only Cua Driver. Machine install is not this flag.
# Effective on = ~/.rig/cua-driver.json opt_in + cua-driver on PATH + enabled=true.
[computer-use]
enabled = false

# Parent-only BrowserSkill. Machine opt-in is not this flag.
# Effective on = ~/.rig/browser-skill.json opt_in + bsk on PATH + extension connected + enabled=true.
[browser-skill]
enabled = false

[sandbox]
# Where workers run. "host" is today's behaviour. "devcontainer" is reserved for
# the dc-cli backend and is refused at launch until that backend ships.
provider = "host"

[worktrees]
# "off" keeps every writer in this checkout under file reservations. "per-job"
# runs each write job in its own git worktree and branch and checks for
# conflicts when the parent accepts the work. Only mode is read by default;
# container = "per-job" gives each worktree its own dc-cli container.
mode = "off"

[mcp]
# Parent tool list. By default every parent tool is listed ("full"). Add a
# profile key with the value "core" to hide cost reporting, benchmark and
# analysis tools; RIG_MCP_PROFILE overrides it. Workers always get the same
# small child set.
